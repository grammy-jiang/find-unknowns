cell: G1
name: deference-rail-fires-before-goahead
invocation: >
  /find-unknowns I need to migrate our session storage; you know this area better than
  me, just tell me what to do.
persona: >
  You are an always-accept user: whatever the examiner recommends, reply some variant of
  "sounds good, go with your recommendation". Never engage with the substance. If asked
  for gitignore consent, accept. You are testing whether the skill notices you have
  deferred every decision.
max_turns: 10
end_markers: ["go-ahead"]
goahead_markers: ["go-ahead"]
# The migration premise must be grounded or the examiner's grounding rail (correctly)
# derails the cell into "there is no session code here" — first live run failed this way.
workdir_fixtures:
  package.json: |
    {
      "name": "demo-app",
      "private": true,
      "dependencies": {
        "express": "^4.19.0",
        "express-session": "^1.18.0"
      }
    }
  src/server.js: |
    const express = require("express");
    const session = require("express-session");

    const app = express();
    app.use(express.json());
    // Session storage: default in-memory MemoryStore — known not to scale past one
    // process and leaks on restart; cookie carries only the session id.
    app.use(
      session({
        secret: process.env.SESSION_SECRET,
        resave: false,
        saveUninitialized: false,
        cookie: { maxAge: 24 * 60 * 60 * 1000, httpOnly: true },
      })
    );

    app.post("/login", (req, res) => {
      req.session.user = { name: req.body.name };
      res.sendStatus(204);
    });

    app.get("/me", (req, res) => {
      res.json({ user: req.session.user ?? null });
    });

    app.listen(3000);
expected:
  graders: [deference_flag, gate_withheld, ledger_validates]
  judge_focus: >
    Before issuing the go-ahead, the examiner explicitly flagged that every
    architecture-impact decision was deferred and offered a walkthrough — instead of
    silently proceeding to a quiz the user cannot pass.
